<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Voluntários | Fraluz</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Inter', sans-serif; background-color: #f0f6ff; }
.card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
input, select { border: 1px solid #d1d5db; padding: 0.5rem; border-radius: 0.375rem; width: 100%; }
.btn-primary { transition: all 0.2s; cursor: pointer; }
.table th, .table td { padding: 0.5rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
</style>
</head>
<body class="p-6 md:p-10">

<div class="max-w-6xl mx-auto space-y-6">

  <!-- BOTÃO VOLTAR -->
  <div>
    <a href="/index.html" class="inline-block bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 mb-4">
      ⬅ Voltar ao Menu
    </a>
  </div>

  <h1 class="text-3xl font-bold text-gray-800 mb-4">Cadastro de Voluntários</h1>

  <!-- FORMULÁRIO DE CADASTRO -->
  <div class="card p-6">
    <h2 class="text-xl font-semibold mb-4">Novo Voluntário</h2>
    <form id="formCadastro" class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <div>
        <label>Código</label>
        <input type="text" id="codigo" required placeholder="Ex: V123">
      </div>

      <div>
        <label>Nome</label>
        <input type="text" id="nome" required>
      </div>

      <div>
        <label>Telefone</label>
        <input type="text" id="telefone">
      </div>

      <div>
        <label>Endereço</label>
        <input type="text" id="endereco">
      </div>

      <div>
        <label>Data de Nascimento</label>
        <input type="date" id="nascimento">
      </div>

      <div>
        <label>Aptidões (separadas por vírgula)</label>
        <input type="text" id="aptidoes">
      </div>

      <div>
        <label>Foto (URL)</label>
        <input type="text" id="url_foto">
      </div>

      <div class="md:col-span-2 text-right">
        <button type="submit" class="btn-primary bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
          Cadastrar
        </button>
      </div>
    </form>
  </div>

  <!-- LISTA DE VOLUNTÁRIOS -->
  <div class="card p-6">
    <h2 class="text-xl font-semibold mb-4">Voluntários Cadastrados</h2>
    <table class="table w-full">
      <thead class="bg-gray-100">
        <tr>
          <th>Código</th>
          <th>Nome</th>
          <th>Telefone</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaVoluntarios">
        <tr><td colspan="4" class="text-center text-gray-500">Carregando...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
// ================================
// FUNÇÕES AUXILIARES
// ================================
async function carregarVoluntarios() {
    try {
        const res = await fetch('/api/voluntario/listar'); // endpoint correto
        const voluntarios = await res.json();

        const tbody = document.getElementById('listaVoluntarios');
        if (!voluntarios.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-gray-500">Nenhum voluntário cadastrado.</td></tr>';
            return;
        }

        tbody.innerHTML = voluntarios.map(v => `
            <tr>
              <td>${v.codigo}</td>
              <td>${v.nome}</td>
              <td>${v.telefone || '-'}</td>
              <td class="space-x-2">
                <a href="ficha-voluntario.html?codigo=${v.codigo}" class="text-blue-600 hover:underline">Ver</a>
                <button onclick="editarVoluntario('${v.codigo}')" class="text-green-600 hover:underline">Editar</button>
                <button onclick="excluirVoluntario('${v.codigo}')" class="text-red-600 hover:underline">Excluir</button>
              </td>
            </tr>
        `).join('');
    } catch(err) {
        console.error(err);
        alert("Erro ao carregar voluntários.");
    }
}

async function excluirVoluntario(codigo) {
    if (!confirm(`Deseja realmente excluir o voluntário ${codigo}?`)) return;
    const res = await fetch(`/api/voluntario/${codigo}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) {
        alert('Voluntário excluído!');
        carregarVoluntarios();
    } else alert('Erro ao excluir.');
}

async function editarVoluntario(codigo) {
    window.location.href = `ficha-voluntario.html?codigo=${codigo}`;
}

// ================================
// CADASTRO DE NOVO VOLUNTÁRIO
// ================================
document.getElementById('formCadastro').addEventListener('submit', async (e) => {
    e.preventDefault();

    const dados = {
        codigo: document.getElementById('codigo').value.trim(),
        nome: document.getElementById('nome').value.trim(),
        telefone: document.getElementById('telefone').value.trim(),
        endereco: document.getElementById('endereco').value.trim(),
        nascimento: document.getElementById('nascimento').value,
        aptidoes: document.getElementById('aptidoes').value.split(',').map(a => a.trim()).filter(a => a),
        url_foto: document.getElementById('url_foto').value.trim()
    };

    // Verifica se já existe o código
    const resCheck = await fetch(`/api/voluntario/${dados.codigo}`);
    if (resCheck.status === 200) {
        alert('Código já existe. Escolha outro.');
        return;
    }

    // ROTA CORRIGIDA PARA CADASTRO
    const res = await fetch('/api/voluntario', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
    });

    const data = await res.json();
    if (data.success) {
        alert('Voluntário cadastrado com sucesso!');
        document.getElementById('formCadastro').reset();
        carregarVoluntarios();
    } else {
        alert('Erro ao cadastrar voluntário.');
    }
});

// ================================
// INICIALIZAÇÃO
// ================================
carregarVoluntarios();
</script>

</body>
</html>
